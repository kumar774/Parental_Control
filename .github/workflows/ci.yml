name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI (Typecheck & Multi-Engine Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password_secure_2026
          POSTGRES_DB: auth001_ci_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install PostgreSQL Client Tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Backend Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Run Cryptographic Unit & Mock Tests
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://ci_test_user:ci_test_password_secure_2026@127.0.0.1:5432/auth001_ci_disposable_test
          ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          IDENTIFIER_RATE_LIMIT_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
        run: npm run test

      - name: Bootstrap Section 8.6 Roles (Superuser Step)
        working-directory: backend
        env:
          PGPASSWORD: ci_test_password_secure_2026
        run: |
          psql -h 127.0.0.1 -p 5432 -U ci_test_user -d auth001_ci_disposable_test -f drizzle/bootstrap_roles.sql

      - name: Apply AUTH-001 Migrations as parental_migrator (Section 8.6)
        working-directory: backend
        env:
          PGPASSWORD: migrator_secure_pass_2026
        run: |
          psql -h 127.0.0.1 -p 5432 -U parental_migrator -d auth001_ci_disposable_test -f drizzle/0000_fast_yellow_claw.sql
          psql -h 127.0.0.1 -p 5432 -U parental_migrator -d auth001_ci_disposable_test -f drizzle/0001_audit_prune_function.sql

      - name: Post-Migration Temporary Privilege Revocation (Superuser Step)
        working-directory: backend
        env:
          PGPASSWORD: ci_test_password_secure_2026
        run: |
          psql -h 127.0.0.1 -p 5432 -U ci_test_user -d auth001_ci_disposable_test -c "REVOKE parental_audit_pruner FROM parental_migrator;"

      - name: Run Genuine PostgreSQL Integration Test Suite (No pg-mem)
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://ci_test_user:ci_test_password_secure_2026@127.0.0.1:5432/auth001_ci_disposable_test
          AUTH001_TEST_DATABASE_NAME: auth001_ci_disposable_test
          AUTH001_TEST_DATABASE_PORT: "5432"
          ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          IDENTIFIER_RATE_LIMIT_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
        run: npm run test:real-pg

  frontend:
    name: Frontend CI (Typecheck, Tests & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Admin_panel/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: Admin_panel
        run: |
          npm ci
          npm install -D tsx --no-save

      - name: Frontend Typecheck
        working-directory: Admin_panel
        run: npm run typecheck

      - name: Frontend Test Suite
        working-directory: Admin_panel
        run: npm test

      - name: Frontend Production Build
        working-directory: Admin_panel
        run: npm run build
