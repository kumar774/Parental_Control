name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI (Typecheck & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Backend Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Backend Test Suite
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/parental_control_test
          ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          IDENTIFIER_RATE_LIMIT_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
        run: npm test

  frontend:
    name: Frontend CI (Typecheck, Tests & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Admin_panel/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: Admin_panel
        run: |
          npm ci
          npm install -D tsx --no-save

      - name: Frontend Typecheck
        working-directory: Admin_panel
        run: npm run typecheck

      - name: Frontend Test Suite
        working-directory: Admin_panel
        run: npm test

      - name: Frontend Production Build
        working-directory: Admin_panel
        run: npm run build
