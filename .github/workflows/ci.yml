name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI (Typecheck & Multi-Engine Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_DB: auth001_ci_disposable_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d auth001_ci_disposable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Credential Hygiene (Static Password Literal Scan)
        run: node backend/scripts/check-credential-hygiene.mjs

      - name: Generate Ephemeral Runtime Database Credentials
        run: |
          # Generate cryptographically secure random passwords from OS random source (192-bit entropy)
          MIGRATOR_PASS=$(openssl rand -hex 24)
          ADMIN_PASS=$(openssl rand -hex 24)
          ARCHIVE_PASS=$(openssl rand -hex 24)
          ATTESTATION_PASS=$(openssl rand -hex 24)

          # Mask all generated credentials in runner logs
          echo "::add-mask::$MIGRATOR_PASS"
          echo "::add-mask::$ADMIN_PASS"
          echo "::add-mask::$ARCHIVE_PASS"
          echo "::add-mask::$ATTESTATION_PASS"

          # Export to GITHUB_ENV for use across subsequent job steps
          echo "CI_MIGRATOR_PASS=$MIGRATOR_PASS" >> $GITHUB_ENV
          echo "CI_ADMIN_PASS=$ADMIN_PASS" >> $GITHUB_ENV
          echo "CI_ARCHIVE_PASS=$ARCHIVE_PASS" >> $GITHUB_ENV
          echo "CI_ATTESTATION_PASS=$ATTESTATION_PASS" >> $GITHUB_ENV

          # Ephemeral loopback connection URL using container trust-authentication (no hardcoded password)
          echo "DATABASE_URL=postgres://ci_test_user@127.0.0.1:5432/auth001_ci_disposable_test" >> $GITHUB_ENV

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install PostgreSQL Client Tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Backend Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Run Cryptographic Unit & Mock Tests
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.DATABASE_URL }}
          ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          IDENTIFIER_RATE_LIMIT_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
        run: npm run test

      - name: Bootstrap Section 8.6 Roles (Superuser Step)
        working-directory: backend
        run: |
          psql -h 127.0.0.1 -p 5432 -U ci_test_user -d auth001_ci_disposable_test \
            -v migrator_password="$CI_MIGRATOR_PASS" \
            -v admin_password="$CI_ADMIN_PASS" \
            -v archive_password="$CI_ARCHIVE_PASS" \
            -v attestation_password="$CI_ATTESTATION_PASS" \
            -f drizzle/bootstrap_roles.sql

      - name: Apply AUTH-001 Migrations as parental_migrator (Section 8.6)
        working-directory: backend
        env:
          PGPASSWORD: ${{ env.CI_MIGRATOR_PASS }}
        run: |
          psql -h 127.0.0.1 -p 5432 -U parental_migrator -d auth001_ci_disposable_test -f drizzle/0000_fast_yellow_claw.sql
          psql -h 127.0.0.1 -p 5432 -U parental_migrator -d auth001_ci_disposable_test -f drizzle/0001_audit_prune_function.sql
          psql -h 127.0.0.1 -p 5432 -U parental_migrator -d auth001_ci_disposable_test -f drizzle/0002_admin_dashboard_hybrid.sql

      - name: Post-Migration Temporary Privilege Revocation (Superuser Step)
        working-directory: backend
        run: |
          psql -h 127.0.0.1 -p 5432 -U ci_test_user -d auth001_ci_disposable_test -c "REVOKE parental_audit_pruner FROM parental_migrator;"

      - name: Run Genuine PostgreSQL Integration Test Suite (No pg-mem)
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.DATABASE_URL }}
          AUTH001_TEST_DATABASE_NAME: auth001_ci_disposable_test
          AUTH001_TEST_DATABASE_PORT: "5432"
          AUTH001_ADMIN_ROLE_PASSWORD: ${{ env.CI_ADMIN_PASS }}
          AUTH001_ARCHIVE_ROLE_PASSWORD: ${{ env.CI_ARCHIVE_PASS }}
          AUTH001_ATTESTATION_ROLE_PASSWORD: ${{ env.CI_ATTESTATION_PASS }}
          ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          IDENTIFIER_RATE_LIMIT_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
        run: npm run test:real-pg

  frontend:
    name: Frontend CI (Typecheck, Tests & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Admin_panel/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: Admin_panel
        run: |
          npm ci
          npm install -D tsx --no-save

      - name: Install Playwright Browsers
        working-directory: Admin_panel
        run: npx playwright install --with-deps chromium

      - name: Frontend Typecheck
        working-directory: Admin_panel
        run: npm run typecheck

      - name: Frontend Unit & API Test Suite
        working-directory: Admin_panel
        run: npm test

      - name: Playwright E2E Browser Test Suite
        working-directory: Admin_panel
        run: npm run test:e2e

      - name: Frontend Production Build
        working-directory: Admin_panel
        run: npm run build
